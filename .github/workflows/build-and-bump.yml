# ---------------------------------------------------------------------------
# CI — construir la imagen, publicarla, y escribir el tag en el overlay.
#
# Es el lazo del Marco 12: **el lazo lo cierra un commit, no un `apply`**. Este
# workflow NO habla con el cluster y no tiene credenciales de Kubernetes; su
# permiso máximo es escribir en este mismo repo. Quien despliega es ArgoCD, que
# reconcilia el repo contra el cluster en su siguiente pasada.
#
#   push a `release`  ->  imagen nueva  ->  bump de k8s/overlays/pre  ->  ns pre
#   push a `main`     ->  imagen nueva  ->  bump de k8s/overlays/pro  ->  ns pro
#
# La promoción de `pre` a `pro` es un **merge** de `release` a `main`. No hay
# ninguna acción sobre el cluster en ningún punto del camino.
#
# ===========================================================================
# CÓMO SE CORTA EL BUCLE DE REALIMENTACIÓN — la decisión de diseño de esta fase
# ===========================================================================
# El commit de bump que escribe este workflow va al MISMO repo y a la MISMA
# rama que lo dispara. Sin nada más, ese commit dispararía el workflow otra vez,
# que escribiría otro commit, indefinidamente: 400 commits automáticos en una
# tarde.
#
# Se corta con `paths-ignore` sobre `k8s/overlays/**`: **el disparador y lo que
# el write-back escribe son conjuntos de ficheros disjuntos**. Un push que sólo
# toca overlays no dispara nada. Es un corte ESTRUCTURAL —lo evalúa la forja
# sobre la lista real de ficheros cambiados—, no una convención textual como
# `[skip ci]` en el mensaje del commit, que cualquiera rompe sin darse cuenta y
# que no deja rastro de por qué estaba ahí.
#
# Consecuencia buscada: tocar un overlay a mano (subir memoria en `pre`, por
# ejemplo) NO reconstruye la imagen. Es correcto: no ha cambiado ningún código,
# y ArgoCD sincroniza igual el cambio del manifiesto.
#
# ===========================================================================
# DÓNDE CORRE — y por qué no puede correr en un runner de GitHub
# ===========================================================================
# El registry es `registry.localtest.me:5111`, que resuelve a **127.0.0.1**.
# Desde un runner hospedado por GitHub eso es el propio runner, donde no hay
# ningún registry: el `docker push` fallaría con "connection refused" tras
# haber construido la imagen entera. Por eso `runs-on: [self-hosted, dev-platform]`.
#
# Requisitos del runner, que hay que verificar ANTES de dar esto por bueno:
#   1. Corre en la MISMA máquina que el cluster k3d (o en su WSL2), porque el
#      nombre del registry sólo resuelve a algo útil allí.
#   2. Tiene acceso al demonio de Docker que publica el puerto 5111.
#   3. Su demonio de Docker admite el registry por HTTP plano
#      (`insecure-registries: ["registry.localtest.me:5111"]` en el daemon.json,
#      o el mirror que ya instala el bootstrap de la plataforma).
#   4. Tiene la etiqueta `dev-platform`, para no repartir estos trabajos a
#      cualquier runner autoalojado de la organización.
# ---------------------------------------------------------------------------
name: build-and-bump

on:
  push:
    branches: [release, main]
    paths-ignore:
      # AQUÍ SE CORTA EL BUCLE. No quitar sin sustituirlo por otro corte.
      - 'k8s/overlays/**'

permissions:
  # Escribir en el repo, y nada más. Ni `packages`, ni nada del cluster.
  contents: write

concurrency:
  # Dos pushes seguidos a la misma rama escribirían dos bumps a la vez y el
  # segundo `git push` fallaría por no-fast-forward. Se serializa por rama.
  group: build-and-bump-${{ github.ref }}
  cancel-in-progress: false

env:
  APP: catalogo-web
  REGISTRY: registry.localtest.me:5111

jobs:
  build-and-bump:
    runs-on: [self-hosted, dev-platform]
    steps:
      - uses: actions/checkout@v5
        with:
          # Hace falta el token persistido para el push del write-back, y la
          # rama concreta (no el commit suelto) para poder commitear encima.
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Calcular el tag inmutable
        id: tag
        shell: bash
        run: |
          SHA=$(git rev-parse --short=12 HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          # release -> pre ; main -> pro. El mapeo rama->entorno vive también
          # en las etiquetas `platform/source-branch` de los namespaces.
          case "${{ github.ref_name }}" in
            release) echo "env=pre" >> "$GITHUB_OUTPUT" ;;
            main)    echo "env=pro" >> "$GITHUB_OUTPUT" ;;
            *) echo "rama no mapeada a ningún entorno"; exit 1 ;;
          esac

      - name: Construir y publicar la imagen
        shell: bash
        run: |
          set -euo pipefail
          REF="$REGISTRY/$APP:${{ steps.tag.outputs.sha }}"
          # `--target prod`: pre y pro sirven el artefacto de producción. La
          # etapa `dev` es exclusiva del inner loop (PLATFORM.md §6).
          docker build --target prod -t "$REF" .
          docker push "$REF"
          # UN TAG, UN CONTENIDO: se comprueba contra el registry que el tag
          # existe de verdad tras el push. NO se usa `docker manifest inspect`:
          # habla HTTPS y este registry es HTTP plano, asi que fallaria con
          # "server gave HTTP response to HTTPS client" DESPUES de un push
          # correcto — el mismo sintoma enganoso que dio Skaffold en la Fase 3.
          # OJO CON EL `Accept`: buildkit publica un INDICE (manifest list) con
          # la attestation, no un manifest suelto. Si el Accept solo pide los
          # tipos de manifest, el registry responde 404 y curl sale con 22 —
          # justo despues de un push que ha ido bien. Hay que pedir los cuatro.
          curl -sf "http://$REGISTRY/v2/$APP/manifests/${{ steps.tag.outputs.sha }}"             -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' >/dev/null

      - name: Escribir el tag en el overlay del entorno
        shell: bash
        run: |
          set -euo pipefail
          ENV="${{ steps.tag.outputs.env }}"
          SHA="${{ steps.tag.outputs.sha }}"
          K="k8s/overlays/$ENV/kustomization.yaml"
          # El marcador REPLACED_BY_CI del repo se sustituye por el sha real.
          # Nunca hay en el repo un tag "plausible" que pueda desplegarse por
          # accidente (PLATFORM.md §2, regla dura 3).
          sed -i -E "s#^(\s*newTag:).*#\1 $SHA#" "$K"
          git diff --quiet "$K" && { echo "el overlay ya apunta a $SHA"; exit 0; }
          git config user.name  "ci[bot]"
          git config user.email "ci@users.noreply.github.com"
          git add "$K"
          git commit -m "chore(deploy): $ENV -> $SHA"
          git push origin "HEAD:${{ github.ref_name }}"
