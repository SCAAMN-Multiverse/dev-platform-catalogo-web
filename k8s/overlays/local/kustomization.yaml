apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: local

resources:
  - ../../base

# `local` corre la etapa `dev` de la imagen (dev server con hot reload).
# El tag lo reescribe Skaffold en cada build; aquí queda una referencia
# explícita para poder aplicar el overlay a mano.
images:
  - name: registry.localtest.me:5111/catalogo-web
    newTag: dev

patches:
  - path: ingress-host.yaml
  - path: resources.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/instance: catalogo-web-local
