# nginx de la etapa `prod`. Escucha en 8080 (sin privilegios); el Service
# expone 80 y apunta a este puerto, así que nada fuera del pod lo nota.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # Contrato §4: /health devuelve 200 sin tocar dependencias externas.
  # Se sirve aquí y no como fichero para que responda igual que en `dev`.
  location = /health {
    add_header Content-Type application/json;
    return 200 '{"status":"ok"}';
  }

  # SPA: cualquier ruta desconocida cae en index.html (routing de cliente).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
